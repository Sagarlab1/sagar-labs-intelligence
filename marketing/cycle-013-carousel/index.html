  <section class="intro"><div style="color:#9cf2e4;font:11px monospace;letter-spacing:.18em">SAGAR / SEÑAL DE INFRAESTRUCTURA</div><h1>Carrusel CYCLE_013</h1><p>Siete láminas. Un límite de evidencia. Revisar localmente antes de agregar enlaces aprobados y publicar.</p></section>
  <main class="carousel">
    <figure><img src="slide-01.svg" alt="Un titular no es un gate. La evidencia pública puede abrir la diligencia, pero no cerrar el gate por sí sola."><figcaption>01 / Entrada</figcaption></figure>
    <figure><img src="slide-02.svg" alt="CYCLE_013 revisó nueve fuentes públicas primarias sobre Christopher M. Crane Clean Energy Center, incluyendo NRC, Constellation y FERC."><figcaption>02 / Expediente</figcaption></figure>
    <figure><img src="slide-03.svg" alt="La señal pública era real, pero la preparación no estaba demostrada. El expediente respaldó pedir más evidencia."><figcaption>03 / Límite</figcaption></figure>
    <figure><img src="slide-04.svg" alt="El libro de gates muestra sin soporte para interconexión, capacidad de la empresa eléctrica, implementación de red y agua; el calendario tiene soporte limitado."><figcaption>04 / Gates</figcaption></figure>
    <figure><img src="slide-05.svg" alt="Una PPA y una fecha esperada son señales públicas; entrega firme y energización siguen en UNKNOWN."><figcaption>05 / Tensión</figcaption></figure>
    <figure><img src="slide-06.svg" alt="No avanzar todavía: pedir, verificar y mantener abierto el gate. Elegible para avanzar: no."><figcaption>06 / Decisión</figcaption></figure>
    <figure><img src="slide-07.svg" alt="El siguiente documento es el producto. La llamada a la acción es traer un sitio, proyecto o decisión con su límite de evidencia."><figcaption>07 / Acción</figcaption></figure>
