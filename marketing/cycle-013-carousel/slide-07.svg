<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">El siguiente documento es el producto</title>
  <desc id="desc">Sagar Infrastructure Signal cierra con una solicitud de evidencia trazable y una llamada a la acción bajo aprobación humana.</desc>
  <rect width="1080" height="1350" fill="#071217"/><circle cx="900" cy="230" r="210" fill="#12383b" opacity=".48"/><path d="M72 144H1008M72 1203H1008" stroke="#214146"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="72" y="86" fill="#9cf2e4" font-size="19" font-weight="700" letter-spacing="3">SAGAR / SEÑAL DE INFRAESTRUCTURA</text><text x="920" y="86" fill="#6f9290" font-size="16" text-anchor="end" letter-spacing="2">07 / 07</text>
    <text x="72" y="188" fill="#6f9290" font-size="14" letter-spacing="1.6">SIGUIENTE DOCUMENTO / SIGUIENTE ACCIÓN</text><text x="72" y="350" fill="#f5f8f6" font-size="62" font-weight="700" letter-spacing="-2">El siguiente documento</text><text x="72" y="422" fill="#f5f8f6" font-size="62" font-weight="700" letter-spacing="-2">es el producto.</text><text x="72" y="505" fill="#9fb5b2" font-size="22">Una señal fuerte termina con una pregunta de decisión.</text>
    <g transform="translate(72 590)"><rect width="936" height="290" fill="#0d2428" stroke="#2c9b8d"/><text x="30" y="57" fill="#9cf2e4" font-size="13" font-weight="700" letter-spacing="2">TRAZABILIDAD DE FUENTES</text><text x="30" y="116" fill="#f5f8f6" font-size="24">NRC · Constellation · FERC</text><text x="30" y="164" fill="#9fb5b2" font-size="20">Índice de fuentes consultado 2026-09-01</text><text x="30" y="222" fill="#9cf2e4" font-size="20" font-weight="700">Sólo revisión de fuentes públicas.</text><text x="30" y="258" fill="#9fb5b2" font-size="18">Sin contactos ni envíos externos.</text></g>
    <g transform="translate(72 956)"><rect width="936" height="148" fill="#102127"/><text x="30" y="49" fill="#9cf2e4" font-size="13" font-weight="700" letter-spacing="2">LLAMADA A LA ACCIÓN</text><text x="30" y="88" fill="#f5f8f6" font-size="25" font-weight="700">¿Tienes un sitio, proyecto o decisión?</text><text x="30" y="123" fill="#f5f8f6" font-size="25" font-weight="700">Tráenos el límite de evidencia.</text></g>
    <text x="72" y="1262" fill="#6f9290" font-size="14" letter-spacing="1.6">SAGAR LABS · EVIDENCIA ANTES DE PREPARACIÓN · APROBACIÓN HUMANA OBLIGATORIA</text>
  </g>
</svg>
