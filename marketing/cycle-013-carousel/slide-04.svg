<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Lo que el expediente no demostró</title>
  <desc id="desc">Libro de gates de CYCLE_013: sin soporte para interconexión, capacidad de la empresa eléctrica, implementación de red y agua; soporte limitado para calendario.</desc>
  <rect width="1080" height="1350" fill="#071217"/><path d="M72 144H1008M72 1203H1008" stroke="#214146"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="72" y="86" fill="#9cf2e4" font-size="19" font-weight="700" letter-spacing="3">SAGAR / SEÑAL DE INFRAESTRUCTURA</text><text x="920" y="86" fill="#6f9290" font-size="16" text-anchor="end" letter-spacing="2">04 / 07</text>
    <text x="72" y="188" fill="#6f9290" font-size="16" letter-spacing="2">EL LIBRO DE GATES</text><text x="72" y="330" fill="#f5f8f6" font-size="64" font-weight="700" letter-spacing="-2">Lo que el expediente</text><text x="72" y="402" fill="#f5f8f6" font-size="64" font-weight="700" letter-spacing="-2">no demostró.</text>
    <text x="72" y="485" fill="#9fb5b2" font-size="22">Si el documento no demuestra el gate,</text><text x="72" y="520" fill="#9fb5b2" font-size="22">el gate permanece abierto.</text>
    <g transform="translate(72 610)"><rect width="936" height="93" fill="#160f15" stroke="#a45f67"/><text x="28" y="40" fill="#e9a9ae" font-size="13" font-weight="700" letter-spacing="2">INTERCONEXIÓN</text><text x="744" y="40" fill="#e9a9ae" font-size="13" font-weight="700" letter-spacing="2">SIN SOPORTE</text><text x="28" y="69" fill="#8fa6a4" font-size="16">Acuerdo · estudio aprobado · punto de conexión · condiciones de entrega</text></g>
    <g transform="translate(72 724)"><rect width="936" height="93" fill="#160f15" stroke="#a45f67"/><text x="28" y="40" fill="#e9a9ae" font-size="13" font-weight="700" letter-spacing="2">CAPACIDAD DE LA EMPRESA ELÉCTRICA</text><text x="744" y="40" fill="#e9a9ae" font-size="13" font-weight="700" letter-spacing="2">SIN SOPORTE</text><text x="28" y="69" fill="#8fa6a4" font-size="16">Capacidad firme documentada · condiciones · periodo · autoridad</text></g>
    <g transform="translate(72 838)"><rect width="936" height="93" fill="#160f15" stroke="#a45f67"/><text x="28" y="40" fill="#e9a9ae" font-size="13" font-weight="700" letter-spacing="2">IMPLEMENTACIÓN DE RED</text><text x="744" y="40" fill="#e9a9ae" font-size="13" font-weight="700" letter-spacing="2">SIN SOPORTE</text><text x="28" y="69" fill="#8fa6a4" font-size="16">Alcance de obras aprobado · responsables · dependencias</text></g>
    <g transform="translate(72 952)"><rect width="936" height="93" fill="#2a2011" stroke="#b0803e"/><text x="28" y="40" fill="#f2c979" font-size="13" font-weight="700" letter-spacing="2">CALENDARIO</text><text x="744" y="40" fill="#f2c979" font-size="13" font-weight="700" letter-spacing="2">SOPORTE LIMITADO</text><text x="28" y="69" fill="#b4aaa0" font-size="15">Sólo cronología del proceso · fecha esperada no demuestra energización</text></g>
    <g transform="translate(72 1066)"><rect width="936" height="93" fill="#160f15" stroke="#a45f67"/><text x="28" y="40" fill="#e9a9ae" font-size="13" font-weight="700" letter-spacing="2">AGUA</text><text x="744" y="40" fill="#e9a9ae" font-size="13" font-weight="700" letter-spacing="2">SIN SOPORTE</text><text x="28" y="69" fill="#8fa6a4" font-size="16">Asignación vinculante · permiso · contrato para sitio y fase</text></g>
    <text x="72" y="1262" fill="#6f9290" font-size="14" letter-spacing="1.6">[UNKNOWN] ES UN ESTADO DE DECISIÓN · NO UN FALLO DE COMUNICACIÓN</text>
  </g>
</svg>
