<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Postura de decisión: todavía no avances</title>
  <desc id="desc">La postura de CYCLE_013 es solicitar una sala de datos técnica y regulatoria, acotada.</desc>
  <rect width="1080" height="1350" fill="#071217"/><path d="M72 144H1008M72 1203H1008" stroke="#214146"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="72" y="86" fill="#9cf2e4" font-size="19" font-weight="700" letter-spacing="3">SAGAR / SEÑAL DE INFRAESTRUCTURA</text><text x="920" y="86" fill="#6f9290" font-size="16" text-anchor="end" letter-spacing="2">06 / 07</text>
    <text x="72" y="188" fill="#6f9290" font-size="16" letter-spacing="2">POSTURA DE DECISIÓN</text><text x="72" y="350" fill="#f5f8f6" font-size="68" font-weight="700" letter-spacing="-2">Todavía no avances.</text><text x="72" y="430" fill="#9fb5b2" font-size="24">El siguiente movimiento es evidencia, no optimismo.</text>
    <g transform="translate(72 575)"><rect width="936" height="230" fill="#101d2b" stroke="#7aaeff"/><text x="32" y="63" fill="#7eaeff" font-size="13" font-weight="700" letter-spacing="2">[VERIFIED] SIGUIENTE DECISIÓN</text><text x="32" y="135" fill="#f5f8f6" font-size="34" font-weight="700">Solicitar una sala de datos</text><text x="32" y="180" fill="#f5f8f6" font-size="34" font-weight="700">técnica y regulatoria, acotada.</text></g>
    <g transform="translate(72 875)"><rect width="292" height="145" fill="#0d2428" stroke="#2c9b8d"/><text x="24" y="43" fill="#9cf2e4" font-size="13" font-weight="700" letter-spacing="2">01 / PEDIR</text><text x="24" y="90" fill="#f5f8f6" font-size="22" font-weight="700">Nombra la prueba faltante.</text></g>
    <g transform="translate(394 875)"><rect width="292" height="145" fill="#13252b" stroke="#f0a15b"/><text x="24" y="43" fill="#f0a15b" font-size="13" font-weight="700" letter-spacing="2">02 / VERIFICAR</text><text x="24" y="84" fill="#f5f8f6" font-size="21" font-weight="700">Comprueba autoridad</text><text x="24" y="113" fill="#f5f8f6" font-size="21" font-weight="700">+ fecha.</text></g>
    <g transform="translate(716 875)"><rect width="292" height="145" fill="#160f15" stroke="#a45f67"/><text x="24" y="43" fill="#e9a9ae" font-size="13" font-weight="700" letter-spacing="2">03 / MANTENER</text><text x="24" y="90" fill="#f5f8f6" font-size="22" font-weight="700">Mantén el gate abierto.</text></g>
    <text x="72" y="1102" fill="#9cf2e4" font-size="25" font-weight="700">ELEGIBLE PARA AVANZAR: NO</text><text x="72" y="1262" fill="#6f9290" font-size="14" letter-spacing="1.6">0 GATES SATISFECHOS · SÓLO REVISIÓN PÚBLICA · REVISIÓN HUMANA OBLIGATORIA</text>
  </g>
</svg>
