<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Empieza por el expediente</title><desc id="desc">CYCLE_013 revisó nueve fuentes públicas, entre ellas NRC, Constellation y FERC.</desc>
  <rect width="1080" height="1350" fill="#071217"/><path d="M72 144H1008M72 1203H1008" stroke="#214146"/><g font-family="Arial,Helvetica,sans-serif"><text x="72" y="86" fill="#9cf2e4" font-size="19" font-weight="700" letter-spacing="3">SAGAR / SEÑAL DE INFRAESTRUCTURA</text><text x="920" y="86" fill="#6f9290" font-size="16" text-anchor="end" letter-spacing="2">02 / 07</text><text x="72" y="188" fill="#6f9290" font-size="16" letter-spacing="2">EMPIEZA POR EL EXPEDIENTE</text><text x="72" y="350" fill="#f5f8f6" font-size="68" font-weight="700" letter-spacing="-2">¿Qué dijo el</text><text x="72" y="425" fill="#f5f8f6" font-size="68" font-weight="700" letter-spacing="-2">expediente público?</text><text x="72" y="505" fill="#9fb5b2" font-size="22">CYCLE_013 revisó fuentes públicas primarias sobre</text><text x="72" y="540" fill="#9fb5b2" font-size="22">Christopher M. Crane Clean Energy Center.</text><g transform="translate(72 650)"><rect width="936" height="128" fill="#0d2428" stroke="#2c9b8d"/><text x="28" y="43" fill="#9cf2e4" font-size="13" font-weight="700" letter-spacing="2">[VERIFIED]</text><text x="28" y="87" fill="#f5f8f6" font-size="28" font-weight="700">9 fuentes públicas indexadas</text></g><g transform="translate(72 842)"><rect width="936" height="86" fill="#0d151f" stroke="#20363a"/><text x="26" y="52" fill="#9fb5b2" font-size="22">NRC · Proceso de licenciamiento e inspección</text></g><g transform="translate(72 946)"><rect width="936" height="86" fill="#0d151f" stroke="#20363a"/><text x="26" y="52" fill="#9fb5b2" font-size="22">Constellation · Anuncio corporativo</text></g><g transform="translate(72 1050)"><rect width="936" height="86" fill="#0d151f" stroke="#20363a"/><text x="26" y="52" fill="#9fb5b2" font-size="22">FERC · Contexto de grandes cargas</text></g><text x="72" y="1262" fill="#6f9290" font-size="14" letter-spacing="1.6">ÍNDICE DE FUENTES CONSULTADO 2026-09-01 · REVISIÓN HUMANA OBLIGATORIA</text></g>
