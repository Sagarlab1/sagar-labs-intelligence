<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Sagar Labs evidence-to-action system</title>
  <desc id="desc">Public signals become evidence, evaluation, decision and action while source boundaries and unknowns remain visible.</desc>
  <rect width="1600" height="560" fill="#f7faf8"/>
  <text x="80" y="72" fill="#102127" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">From public signal to decision action</text>
  <text x="80" y="106" fill="#5f7776" font-family="Arial,Helvetica,sans-serif" font-size="16">Sagar Labs keeps the evidence boundary visible at every gate.</text>
  <g font-family="Arial,Helvetica,sans-serif">
    <g transform="translate(80 180)"><rect width="250" height="220" rx="4" fill="#e6f3ef" stroke="#2c9b8d" stroke-width="2"/><text x="24" y="46" fill="#146b68" font-size="13" font-weight="700" letter-spacing="1.5">01 / SEÑALES PÚBLICAS</text><text x="24" y="92" fill="#102127" font-size="24" font-weight="700">Public signals</text><text x="24" y="130" fill="#405457" font-size="16">Announcements, filings,</text><text x="24" y="155" fill="#405457" font-size="16">agency records, documents.</text><text x="24" y="195" fill="#146b68" font-size="13">[PUBLIC SIGNAL]</text></g>
    <g transform="translate(400 180)"><rect width="250" height="220" rx="4" fill="#edf5f3" stroke="#2c9b8d" stroke-width="2"/><text x="24" y="46" fill="#146b68" font-size="13" font-weight="700" letter-spacing="1.5">02 / EVIDENCIA</text><text x="24" y="92" fill="#102127" font-size="24" font-weight="700">Evidence</text><text x="24" y="130" fill="#405457" font-size="16">Source, date, scope,</text><text x="24" y="155" fill="#405457" font-size="16">authority and limitation.</text><text x="24" y="195" fill="#146b68" font-size="13">[VERIFIED] · [UNKNOWN]</text></g>
    <g transform="translate(720 180)"><rect width="250" height="220" rx="4" fill="#fff4e9" stroke="#f0a15b" stroke-width="2"/><text x="24" y="46" fill="#a65d20" font-size="13" font-weight="700" letter-spacing="1.5">03 / EVALUACIÓN</text><text x="24" y="92" fill="#102127" font-size="24" font-weight="700">Evaluation</text><text x="24" y="130" fill="#405457" font-size="16">Gates, contradictions,</text><text x="24" y="155" fill="#405457" font-size="16">missing proof, confidence.</text><text x="24" y="195" fill="#a65d20" font-size="13">SCOPE BEFORE SCORE</text></g>
    <g transform="translate(1040 180)"><rect width="250" height="220" rx="4" fill="#f2f0fa" stroke="#7e73b8" stroke-width="2"/><text x="24" y="46" fill="#5a4d9c" font-size="13" font-weight="700" letter-spacing="1.5">04 / DECISIÓN</text><text x="24" y="92" fill="#102127" font-size="24" font-weight="700">Decision</text><text x="24" y="130" fill="#405457" font-size="16">Advance, condition, pause,</text><text x="24" y="155" fill="#405457" font-size="16">redesign or do not advance.</text><text x="24" y="195" fill="#5a4d9c" font-size="13">HUMAN REVIEW</text></g>
    <g transform="translate(1360 180)"><rect width="160" height="220" rx="4" fill="#102127"/><text x="20" y="46" fill="#9cf2e4" font-size="13" font-weight="700" letter-spacing="1.5">05 / ACCIÓN</text><text x="20" y="92" fill="#f5f8f6" font-size="24" font-weight="700">Action</text><text x="20" y="130" fill="#b9cbc8" font-size="16">Next evidence</text><text x="20" y="155" fill="#b9cbc8" font-size="16">request + owner.</text><text x="20" y="195" fill="#9cf2e4" font-size="13">TRACEABLE</text></g>
  </g>
  <g stroke="#8ea5a2" stroke-width="2" fill="none"><path d="M330 290h58"/><path d="M650 290h58"/><path d="M970 290h58"/><path d="M1290 290h58"/></g>
  <g fill="#8ea5a2"><path d="m380 283 12 7-12 7z"/><path d="m700 283 12 7-12 7z"/><path d="m1020 283 12 7-12 7z"/><path d="m1340 283 12 7-12 7z"/></g>
  <text x="80" y="490" fill="#5f7776" font-family="Arial,Helvetica,sans-serif" font-size="14">No invented scores, outcomes or buyer proof. Every claim retains its source boundary.</text>
</svg>
